# The whole system on one machine: `docker compose up`.
name: ctff

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ctff
      POSTGRES_PASSWORD: ctff
      POSTGRES_DB: ctff
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ctff -d ctff']
      interval: 5s
      timeout: 3s
      retries: 10

  # Core, with the admin app on the same origin: http://localhost:3000
  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    image: ctff-core:local
    environment:
      DATABASE_URL: postgres://ctff:ctff@postgres:5432/ctff
      PORT: '3000'
      LOG_LEVEL: info
      # Seeds the Birdwatch demo project on an empty database; set SEED_DEMO=false to start without it.
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  evaluator:
    build:
      context: .
      dockerfile: apps/evaluator/Dockerfile
    image: ctff-evaluator:local
    environment:
      CORE_URL: http://core:3000
      PORT: '3000'
      LOG_LEVEL: info
      POLL_INTERVAL_MS: '2000'
    ports:
      - '3001:3000'
    # No depends_on: the Evaluator polls until Core answers, and reports healthy (ready) only once it has loaded
    # its first snapshots. Once loaded, it keeps serving them while Core is stopped.

  # Birdwatch, the demo: its API evaluates flags through the Evaluator with @ctff/nestjs.
  birdwatch-api:
    build:
      context: .
      dockerfile: apps/birdwatch-api/Dockerfile
    image: ctff-birdwatch-api:local
    environment:
      EVALUATOR_URL: http://evaluator:3000
      # The SDK key of birdwatch/development is generated, so the API looks it up in Core (or set CTFF_SDK_KEY).
      CORE_URL: http://core:3000
      CTFF_PROJECT: birdwatch
      CTFF_ENVIRONMENT: development
      PORT: '3000'
      LOG_LEVEL: info
    ports:
      - '4001:3000'
    # No depends_on: the API waits until Core has the environment, then starts listening.

  # Birdwatch's website: http://localhost:4000
  birdwatch-web:
    build:
      context: .
      dockerfile: apps/birdwatch-web/Dockerfile
    image: ctff-birdwatch-web:local
    environment:
      BIRDWATCH_API_URL: http://birdwatch-api:3000
      # The flag inspector links each flag to the admin app, as the browser reaches it, in birdwatch/development.
      CTFF_ADMIN_URL: http://localhost:3000
      CTFF_PROJECT: birdwatch
      CTFF_ENVIRONMENT: development
      PORT: '3000'
      LOG_LEVEL: info
    ports:
      - '4000:3000'
    # Reports healthy (ready) while birdwatch-api is.

volumes:
  postgres-data:
