# The whole system on one machine: `docker compose up`.
name: ctff

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ctff
      POSTGRES_PASSWORD: ctff
      POSTGRES_DB: ctff
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ctff -d ctff']
      interval: 5s
      timeout: 3s
      retries: 10

  # Core, with the admin app on the same origin: http://localhost:3000
  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    image: ctff-core:local
    environment:
      DATABASE_URL: postgres://ctff:ctff@postgres:5432/ctff
      PORT: '3000'
      LOG_LEVEL: info
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
