# The whole system on one machine: `docker compose up`.
# Every service built here has `pull_policy: build`, so `up` rebuilds its image from the current source (Docker's
# layer cache keeps that quick) instead of reusing a `ctff-*:local` image built from an older checkout.
name: ctff

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ctff
      POSTGRES_PASSWORD: ctff
      POSTGRES_DB: ctff
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ctff -d ctff']
      interval: 5s
      timeout: 3s
      retries: 10

  # Core, with the admin app on the same origin: http://localhost:3000
  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    image: ctff-core:local
    pull_policy: build
    environment:
      DATABASE_URL: postgres://ctff:ctff@postgres:5432/ctff
      PORT: '3000'
      LOG_LEVEL: info
      # Seeds the Birdwatch demo project on an empty database; set SEED_DEMO=false to start without it.
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  evaluator:
    build:
      context: .
      dockerfile: apps/evaluator/Dockerfile
    image: ctff-evaluator:local
    pull_policy: build
    environment:
      CORE_URL: http://core:3000
      PORT: '3000'
      LOG_LEVEL: info
      POLL_INTERVAL_MS: '2000'
    ports:
      - '3001:3000'
    # No depends_on: the Evaluator polls until Core answers, and reports healthy (ready) only once it has loaded
    # its first snapshots. Once loaded, it keeps serving them while Core is stopped.

  # Birdwatch, the demo: its API evaluates flags through the Evaluator with @ctff/nestjs.
  birdwatch-api:
    build:
      context: .
      dockerfile: apps/birdwatch-api/Dockerfile
    image: ctff-birdwatch-api:local
    pull_policy: build
    environment:
      EVALUATOR_URL: http://evaluator:3000
      # The SDK key of birdwatch/development is generated, so the API looks it up in Core (or set CTFF_SDK_KEY).
      CORE_URL: http://core:3000
      CTFF_PROJECT: birdwatch
      CTFF_ENVIRONMENT: development
      PORT: '3000'
      LOG_LEVEL: info
    ports:
      - '4001:3000'
    # No depends_on: the API waits until Core has the environment, then starts listening.

  # Birdwatch's website: http://localhost:4000
  birdwatch-web:
    build:
      context: .
      dockerfile: apps/birdwatch-web/Dockerfile
    image: ctff-birdwatch-web:local
    pull_policy: build
    environment:
      BIRDWATCH_API_URL: http://birdwatch-api:3000
      # The flag inspector links each flag to the admin app, as the browser reaches it, in birdwatch/development.
      CTFF_ADMIN_URL: http://localhost:3000
      CTFF_PROJECT: birdwatch
      CTFF_ENVIRONMENT: development
      PORT: '3000'
      LOG_LEVEL: info
    ports:
      - '4000:3000'
    # Reports healthy (ready) while birdwatch-api is.

  # The showcase website, static files served by nginx: http://localhost:8080
  showcase:
    build:
      context: .
      dockerfile: apps/showcase/Dockerfile
    image: ctff-showcase:local
    pull_policy: build
    environment:
      PORT: '8080'
    ports:
      - '8080:8080'

  # Optional: `docker compose --profile terraform up` also builds the Terraform provider and applies the example
  # configuration (apps/terraform-provider-ctff/examples/birdwatch) to Core, then exits. The first run imports the
  # demo project Core seeded and applies the configuration over it (with SEED_DEMO=false, it creates the project).
  # Its Terraform state is kept in a volume, so running it again only puts back what drifted.
  terraform:
    profiles: [terraform]
    build:
      context: .
      dockerfile: apps/terraform-provider-ctff/Dockerfile
    image: ctff-terraform:local
    pull_policy: build
    environment:
      CTFF_BASE_URL: http://core:3000
    volumes:
      - terraform-state:/state
    depends_on:
      core:
        condition: service_healthy
    restart: 'no'

volumes:
  postgres-data:
  terraform-state:
