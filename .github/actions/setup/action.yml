name: Set up the workspace
description: Install pnpm, Node (from .nvmrc) and dependencies, and derive NX_BASE / NX_HEAD for nx affected. Run after actions/checkout.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - uses: nrwl/nx-set-shas@v5
