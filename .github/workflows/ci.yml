name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  checks:
    name: Lint, typecheck, test and build (affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/setup
      - run: pnpm nx affected -t lint typecheck test build

  images:
    name: Build images (affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/setup
      # Projects with an image define a `docker-build` target. Images are built, never pushed.
      - run: pnpm nx affected -t docker-build
