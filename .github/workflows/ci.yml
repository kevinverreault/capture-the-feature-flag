name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  checks:
    name: Lint, typecheck, test and build (affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/setup
      # The Terraform provider (apps/terraform-provider-ctff) is Go, and its acceptance tests drive a real
      # Terraform CLI against Core (ADR 0004).
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/terraform-provider-ctff/go.mod
          cache-dependency-path: apps/terraform-provider-ctff/go.sum
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: pnpm nx affected -t lint typecheck test build

  images:
    name: Build images (affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/setup
      # Projects with an image define a `docker-build` target. Images are built, never pushed.
      - run: pnpm nx affected -t docker-build

  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/setup
      # The end-to-end script below evaluates through the built SDK.
      - run: pnpm nx run @ctff/sdk:build
      # --wait returns once every service with a health check reports healthy (Core: migrated and ready;
      # Evaluator: first snapshots loaded).
      - run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Services run as non-root
        run: |
          test "$(docker compose exec -T core id -u)" != "0"
          test "$(docker compose exec -T evaluator id -u)" != "0"
      - name: Core serves its API on the migrated database
        run: |
          curl --fail --silent --show-error http://localhost:3000/health/ready
          curl --fail --silent --show-error http://localhost:3000/api/v1/openapi.json > /dev/null
          curl --fail --silent --show-error -X POST http://localhost:3000/api/v1/projects \
            -H 'content-type: application/json' -d '{"key":"smoke-test","name":"Smoke test"}'
      - name: Core serves the admin app, which reads the API
        run: curl --fail --silent --show-error http://localhost:3000/projects | grep --quiet 'Smoke test'
      - name: The SDK sees targeting switched on through Core within one poll interval
        run: echo "SDK_KEY=$(node apps/evaluator/scripts/compose-smoke.ts switch-on)" >> "$GITHUB_ENV"
      - name: The Evaluator keeps serving its last snapshot while Core is stopped
        run: |
          docker compose stop core
          sleep 5
          curl --fail --silent --show-error http://localhost:3001/health/ready
          node apps/evaluator/scripts/compose-smoke.ts expect "$SDK_KEY" smoke-test-flag true
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
