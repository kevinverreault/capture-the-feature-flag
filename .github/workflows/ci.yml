name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  checks:
    name: Lint, typecheck, test and build (affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/setup
      # The Terraform provider (apps/terraform-provider-ctff) is Go, and its acceptance tests drive a real
      # Terraform CLI against Core (ADR 0004).
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/terraform-provider-ctff/go.mod
          cache-dependency-path: apps/terraform-provider-ctff/go.sum
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: pnpm nx affected -t lint typecheck test build

  images:
    name: Build images (affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/setup
      # Projects with an image define a `docker-build` target. Images are built, never pushed.
      - run: pnpm nx affected -t docker-build

  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/setup
      # The end-to-end script below evaluates through the built SDK.
      - run: pnpm nx run @ctff/sdk:build
      # --wait returns once every service with a health check reports healthy (Core: migrated, seeded and ready;
      # Evaluator: first snapshots loaded; birdwatch-api: SDK key found; birdwatch-web: birdwatch-api ready;
      # showcase: nginx serving).
      - run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Services run as non-root
        run: |
          test "$(docker compose exec -T core id -u)" != "0"
          test "$(docker compose exec -T evaluator id -u)" != "0"
          test "$(docker compose exec -T birdwatch-api id -u)" != "0"
          test "$(docker compose exec -T birdwatch-web id -u)" != "0"
          test "$(docker compose exec -T showcase id -u)" != "0"
      - name: Core serves its API on the migrated database
        run: |
          curl --fail --silent --show-error http://localhost:3000/health/ready
          curl --fail --silent --show-error http://localhost:3000/api/v1/openapi.json > /dev/null
          curl --fail --silent --show-error -X POST http://localhost:3000/api/v1/projects \
            -H 'content-type: application/json' -d '{"key":"smoke-test","name":"Smoke test"}'
      - name: Core serves the admin app, which reads the API
        run: curl --fail --silent --show-error http://localhost:3000/projects | grep --quiet 'Smoke test'
      - name: The showcase serves its pages statically
        run: |
          for page in / /how-it-works/ /quickstart/ /guides/sdk/ /guides/terraform/ /roadmap/; do
            curl --fail --silent --show-error "http://localhost:8080$page" | grep --quiet 'Capture The Feature Flag'
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/no-such-page)" = 404
      - name: The SDK sees targeting switched on through Core within one poll interval
        run: echo "SDK_KEY=$(node apps/evaluator/scripts/compose-smoke.ts switch-on)" >> "$GITHUB_ENV"
      - name: Birdwatch logs sightings while new-sighting-form is on, hides the form within one poll interval, and shows the targeting showcase
        run: node apps/birdwatch-api/scripts/compose-smoke.ts
      - name: The Evaluator keeps serving its last snapshot while Core is stopped
        run: |
          docker compose stop core
          sleep 5
          curl --fail --silent --show-error http://localhost:3001/health/ready
          node apps/evaluator/scripts/compose-smoke.ts expect "$SDK_KEY" smoke-test-flag true
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  e2e:
    name: End-to-end suite (S5) over compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/setup
      - run: pnpm --filter @ctff/e2e exec playwright install --with-deps chromium
      # The suite's global setup starts the stack (compose.yaml with apps/e2e/compose.e2e.yaml) and waits until every
      # service is healthy, then runs the scenarios headless. The stack is kept for the logs, and stopped below.
      - name: Playwright drives the admin app, Birdwatch and the showcase over the compose stack
        run: pnpm nx run @ctff/e2e:e2e
        env:
          E2E_STACK: compose
          E2E_KEEP_STACK: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
      - if: failure()
        run: docker compose -f compose.yaml -f apps/e2e/compose.e2e.yaml logs
      - if: always()
        run: docker compose -f compose.yaml -f apps/e2e/compose.e2e.yaml down --volumes

  compose-terraform:
    name: Compose Terraform profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # The documented command, detached. The one-shot terraform service applies the example configuration once Core
      # is healthy, and exits with the apply's exit code.
      - name: The terraform profile builds the provider and applies the example configuration
        run: |
          docker compose --profile terraform up --build --detach
          docker compose --profile terraform wait terraform || true
          container=$(docker compose --profile terraform ps --all --quiet terraform)
          # Exited, not still running (an ExitCode of 0 alone would also match a running container).
          test "$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' "$container")" = 'exited 0'
      - run: docker compose up --detach --wait --wait-timeout 300
      # Core's demo seed creates the project first (actor seed), with the same targeting as the example; Terraform
      # adopts it and takes its flags over, so only the flags change on the first apply.
      - name: Core holds the example configuration, managed by and attributed to terraform
        run: |
          curl --fail --silent --show-error http://localhost:3000/api/v1/projects/birdwatch/flags/rare-bird-alerts/targeting/production \
            | jq --exit-status '.on == true and .rules[0].values == ["CA"]'
          curl --fail --silent --show-error http://localhost:3000/api/v1/projects/birdwatch/flags \
            | jq --exit-status 'length == 3 and all(.[]; .managedBy == "terraform")'
          curl --fail --silent --show-error 'http://localhost:3000/api/v1/audit-entries?projectKey=birdwatch&limit=200' \
            | jq --exit-status 'all(.entries[]; .actor == "seed" or .actor == "terraform")
                and any(.entries[]; .actor == "terraform" and .targetType == "flag")'
      # The restore is a targeting change, so its audit entry, the flag's latest, is attributed to terraform.
      - name: Applying again restores targeting edited in the admin app
        run: |
          url=http://localhost:3000/api/v1/projects/birdwatch/flags/new-sighting-form/targeting/production
          version=$(curl --fail --silent --show-error "$url" | jq .version)
          curl --fail --silent --show-error -X PATCH "$url" -H 'content-type: application/json' \
            -d "{\"version\": $version, \"on\": false}" > /dev/null
          docker compose --profile terraform run --rm terraform
          curl --fail --silent --show-error "$url" | jq --exit-status '.on == true'
          curl --fail --silent --show-error 'http://localhost:3000/api/v1/audit-entries?projectKey=birdwatch&flagKey=new-sighting-form&limit=1' \
            | jq --exit-status '.entries[0] | .actor == "terraform" and .targetType == "targeting"
                and .environmentKey == "production"'
      - if: failure()
        run: docker compose --profile terraform logs
      - if: always()
        run: docker compose --profile terraform down --volumes
